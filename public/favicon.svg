<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Obsidian Dark Metallic -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e15" />
      <stop offset="50%" stop-color="#12141f" />
      <stop offset="100%" stop-color="#08090d" />
    </linearGradient>

    <!-- Specular Rim Light Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#818cf8" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.6" />
    </linearGradient>

    <!-- Letter "S" Gradient: Electric Cyan to Vivid Royal Blue & Indigo -->
    <linearGradient id="sGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#0077ed" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Ambient Center Glow Behind "S" -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Filter for subtle drop shadow and glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base with 116px corner radius (Apple iOS/VisionOS standard) -->
  <rect x="16" y="16" width="480" height="480" rx="116" ry="116" fill="url(#bgGrad)" />

  <!-- Ambient Glow Behind "S" -->
  <circle cx="256" cy="256" r="180" fill="url(#ambientGlow)" />

  <!-- Specular Rim Border -->
  <rect x="16" y="16" width="480" height="480" rx="116" ry="116" fill="none" stroke="url(#rimGrad)" stroke-width="8" />

  <!-- Top-edge Glass Specular Highlight -->
  <path d="M 120 20 Q 256 16 392 20" stroke="rgba(255, 255, 255, 0.45)" stroke-width="3" fill="none" stroke-linecap="round" />

  <!-- Custom Masterpiece "S" Glyph -->
  <!-- Modern Geometric Curved Proportions with Precision Optical Terminals -->
  <g filter="url(#softGlow)">
    <path d="
      M 342 166
      C 328 140 300 124 258 124
      C 202 124 164 158 164 204
      C 164 246 194 270 244 286
      L 272 295
      C 314 309 338 328 338 362
      C 338 408 296 440 242 440
      C 192 440 156 414 140 382
      L 182 354
      C 194 374 216 392 246 392
      C 274 392 292 376 292 354
      C 292 322 268 304 220 288
      L 194 280
      C 152 264 122 238 122 198
      C 122 148 168 116 230 116
      C 278 116 318 136 338 172
      Z
    " fill="url(#sGrad)" />
  </g>

  <!-- Modern Tech Accent Dots for Sanjarbek / sanjarme.uz Identity -->
  <circle cx="360" cy="150" r="10" fill="#38bdf8" />
  <circle cx="152" cy="362" r="8" fill="#818cf8" opacity="0.9" />
</svg>